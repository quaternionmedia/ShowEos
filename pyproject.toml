[project]
name = "showeos"
version = "0.1.0"
description = "ShowRunner plugin for ETC Eos lighting cue design and control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["showrunner[cli,osc]>=0.5.1"]

[project.entry-points.showrunner]
showeos = "showeos.plugin:ShowEosPlugin"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["showeos"]
